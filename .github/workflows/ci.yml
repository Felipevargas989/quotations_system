# Fase 2 Bloque D — el revisor automático.
#
# Corre en cada push y en cada PR: construye y prueba backend y
# frontend. Con la protección de la rama main, NADA con esto en rojo
# puede llegar a producción (main = despliegue automático del backend
# en Railway).
#
# Los dos trabajos se llaman "backend" y "frontend": esos nombres son
# los que la protección de main exige en verde. Si se renombran acá,
# hay que renombrarlos también en la protección.

name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-rest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-rest/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
      - name: Pruebas (29 suites)
        run: npx jest --silent
      # Fase 2 cierre (28-07): de 237 avisos quedaron 19 (deuda tipada
      # del patrón {data,error} en 4 módulos antiguos; se paga "al
      # tocar"). Este techo impide que VUELVA a crecer: si un cambio
      # agrega avisos nuevos, el candado lo rechaza.
      - name: Lint (techo 19 — la deuda solo baja)
        run: |
          ERRORES=$(npx eslint "src/**/*.ts" 2>/dev/null | grep -oE '[0-9]+ problems' | grep -oE '^[0-9]+' | head -1)
          ERRORES=${ERRORES:-0}
          echo "avisos de lint: $ERRORES (techo: 19)"
          test "$ERRORES" -le 19

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Valores de forma para que el build compile; las llaves REALES
      # se inyectan solo al construir para publicar (03_COMO_PUBLICAR).
      VITE_EVENTIA_API_REST: https://ci.invalid
      VITE_SUPABASE_URL: https://ci.invalid
      VITE_SUPABASE_ANON_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Tipos + construcción (tsc + vite)
        run: npm run build
      - name: Pruebas (vitest)
        run: npm run test
      # Portero del kit de la casa (13-08): mismo principio que el techo
      # de lint del backend. El sistema tiene piezas propias —desplegable
      # con buscador, elección múltiple, avisos, confirmaciones, campo
      # numérico— y aun así se seguían escribiendo copias a mano al lado.
      # Es GENÉRICO: cada pieza nueva se protege agregando una línea al
      # script, no escribiendo otro portero. Ahí están los techos y el
      # mensaje de qué usar cuando frena.
      - name: Portero del kit de la casa (la deuda solo baja)
        run: bash scripts/portero-kit-de-la-casa.sh
